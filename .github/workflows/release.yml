name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write  # create the GitHub Release
  id-token: write  # request the GitHub OIDC token for NuGet Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0.x supplies the runtime the net8.0 test run needs; global.json still pins the SDK.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --solution ExecutorService.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/ExecutorService/ExecutorService.csproj --configuration Release --no-build --output artifacts/

      # Exchanges the OIDC token for an API key that is valid for one hour, so it
      # must be requested immediately before the push.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: arielpineiro  # nuget.org profile name, not the account email

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.*nupkg
          generate_release_notes: true
