name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # MinVer needs tags

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # 8.0.x supplies the runtime the net8.0 test run needs; global.json still pins the SDK.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore

      # Keep the pinned version in sync with MARKDOWNLINT in Taskfile.yml.
      - name: Markdown lint
        if: runner.os == 'Linux'
        run: npx --yes markdownlint-cli2@0.23.2

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ExecutorService.slnx --configuration Release --no-build

      # The library declares IsAotCompatible; this is what proves it. The sample restores ExecutorService
      # from nuget.org, so what gets compiled into the native image is the published assembly.
      - name: Native AOT smoke test
        if: runner.os == 'Linux'
        run: |
          dotnet publish samples/ExecutorService.QuickStart.Sample --configuration Release \
            -p:PublishAot=true -o artifacts/aot
          ./artifacts/aot/ExecutorService.QuickStart.Sample

      - name: Coverage gate (100% line and branch)
        if: runner.os == 'Linux'
        run: |
          dotnet test --solution ExecutorService.slnx --configuration Release --no-build \
            --framework net10.0 --results-directory TestResults -- \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          line=$(sed -n 's/.*<coverage [^>]*line-rate="\([0-9.]*\)".*/\1/p' TestResults/coverage.cobertura.xml | head -1)
          branch=$(sed -n 's/.*<coverage [^>]*branch-rate="\([0-9.]*\)".*/\1/p' TestResults/coverage.cobertura.xml | head -1)
          echo "line-rate=$line branch-rate=$branch"
          test "$line" = "1" && test "$branch" = "1"

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/ExecutorService/ExecutorService.csproj --configuration Release --no-build --output artifacts/

      - name: Upload package artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
