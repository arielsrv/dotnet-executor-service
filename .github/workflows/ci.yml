name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0.x supplies the runtime the net8.0 test run needs; global.json still pins the SDK.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ExecutorService.slnx --configuration Release --no-build

      - name: Coverage gate (100% line and branch)
        if: runner.os == 'Linux'
        run: |
          dotnet test --solution ExecutorService.slnx --configuration Release --no-build \
            --framework net10.0 --results-directory TestResults -- \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          line=$(sed -n 's/.*<coverage [^>]*line-rate="\([0-9.]*\)".*/\1/p' TestResults/coverage.cobertura.xml | head -1)
          branch=$(sed -n 's/.*<coverage [^>]*branch-rate="\([0-9.]*\)".*/\1/p' TestResults/coverage.cobertura.xml | head -1)
          echo "line-rate=$line branch-rate=$branch"
          test "$line" = "1" && test "$branch" = "1"

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/ExecutorService/ExecutorService.csproj --configuration Release --no-build --output artifacts/

      - name: Upload package artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
