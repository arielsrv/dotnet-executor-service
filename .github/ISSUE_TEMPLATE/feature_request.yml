name: Feature request
description: Propose a new API or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the API you have in mind. Reference the Java equivalent if there is one.
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
